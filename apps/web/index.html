<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Digital School — منصة تشغيل المحادثات والقنوات والحملات" />
    <title>Digital School Operations</title>
    <!--
      Theme and language are decided before the first paint from local visual
      preferences. They carry no identity, tenant or authorization information;
      the session remains an HTTP-only cookie confirmed by the API.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('convo.theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        // This mirrors `src/prepaint-language.ts`, which supplies the
        // deterministic regression cases. Keep the inline version small so it
        // executes before the module and before the first protected frame.
        // It accepts only the presentation language from the current hash.
        var routeLang = null;
        var queryAt = window.location.hash.indexOf('?');
        if (queryAt !== -1) {
          var parts = window.location.hash.slice(queryAt + 1).split('&');
          for (var index = 0; index < parts.length; index += 1) {
            var pair = parts[index].split('=', 2);
            var key = '';
            var value = '';
            try {
              key = decodeURIComponent(pair[0].replace(/\+/g, ' '));
              value = decodeURIComponent((pair[1] || '').replace(/\+/g, ' '));
            } catch (error) {
              continue;
            }
            if (key === 'lang' && (value === 'en' || value === 'ar')) {
              routeLang = value;
              break;
            }
          }
        }
        var lang = null;
        if (routeLang === null) {
          try {
            lang = window.localStorage.getItem('convo.lang');
          } catch (error) {
            lang = null;
          }
        }
        if (routeLang === 'en' || routeLang === 'ar') lang = routeLang;
        if (lang !== 'en' && lang !== 'ar') lang = 'ar';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      })();
    </script>
    <!--
      IBM Plex Sans Arabic is self-hosted from /fonts (SIL OFL 1.1, licence beside
      the files). No third-party font host is contacted.
    -->
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      The same branded wait the app draws while the session is checked, so the
      hand-over from this placeholder to the first render does not flash. No
      navigation, tenant or screen exists until the server confirms a session.
    -->
    <div id="app" class="app-boot" role="status" aria-live="polite">
      <span>DIGITAL SCHOOL</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
