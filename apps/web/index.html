<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/ds-icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DS Omnichannel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="DS Omnichannel — One Inbox. Every conversation." />
    <meta property="og:title" content="DS Omnichannel" />
    <meta property="og:description" content="One Inbox. Every conversation." />
    <meta name="application-name" content="DS Omnichannel" />
    <title>DS Omnichannel</title>
    <style>
      html[data-theme='light'] { background: #e8eef8; color: #0a1630; }
      html[data-theme='dark'] { background: #050c18; color: #eef3fb; }
      body { margin: 0; }
      #app.app-boot { display: grid; grid-template-columns: 64px minmax(0, 1fr); height: 100dvh; overflow: hidden; }
      html[data-theme='light'] #app.app-boot { --boot-line: rgba(16,33,63,.07); --boot-edge: rgba(16,33,63,.1); --boot-nav: #071a3a; --boot-surface: #ffffff; }
      html[data-theme='dark'] #app.app-boot { --boot-line: rgba(255,255,255,.06); --boot-edge: rgba(255,255,255,.08); --boot-nav: #050e1d; --boot-surface: #0c182b; }
      .app-boot__nav { display: flex; flex-direction: column; align-items: center; gap: 20px; border-inline-end: 1px solid rgba(255,255,255,.07); padding: 15px; background: var(--boot-nav); }
      .app-boot__mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #ddff57; color: #004fef; font: 800 13px system-ui,sans-serif; }
      .app-boot__nav-item { width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,.08); }
      .app-boot__main { display: grid; grid-template-rows: 56px minmax(0, 1fr); min-width: 0; }
      .app-boot__header { border-block-end: 1px solid var(--boot-edge); padding: 20px; background: var(--boot-surface); }
      .app-boot__line { display: block; width: 140px; height: 12px; border-radius: 6px; background: var(--boot-line); }
      .app-boot__body { display: grid; grid-template-columns: minmax(0,1fr); gap: 20px; padding: 20px; }
      .app-boot__row { display: block; height: 64px; border-radius: 6px; background: var(--boot-line); }
      .app-boot__rows { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); align-content: start; gap: 12px; }
      .app-boot__content { display: none; }
      .app-boot__brand-name { color: #004fef; font: 700 16px system-ui,sans-serif; letter-spacing: -.02em; }
      .app-boot__status { color: #5a6781; font: 13px system-ui,sans-serif; }
      html[data-theme='dark'] .app-boot__status { color: #94a3bb; }
      html[data-theme='dark'] .app-boot__brand-name { color: #ffffff; }
      html[lang='ar'] .app-boot__status[lang='en'], html[lang='en'] .app-boot__status[lang='ar'] { display: none; }
      html[lang='ar'] .app-boot__brand-name[lang='en'], html[lang='en'] .app-boot__brand-name[lang='ar'] { display: none; }
      html[data-boot-screen='inbox'] .app-boot__body { grid-template-columns: minmax(260px,352px) minmax(0,1fr); }
      html[data-boot-screen='inbox'] .app-boot__rows { grid-template-columns: minmax(0,1fr); }
      html[data-boot-screen='inbox'] .app-boot__content { display: grid; align-content: center; justify-items: center; gap: 18px; }
      html[data-boot-screen='inbox'] .app-boot__content .app-boot__line { width: 70%; }
      html[data-boot-screen='auth'] .app-boot__rows { display: none; }
      html[data-boot-screen='auth'] .app-boot__content { display: grid; align-content: center; justify-items: center; gap: 18px; }
      @media (max-width: 959px) {
        #app.app-boot { grid-template-columns: minmax(0,1fr); }
        .app-boot__nav { display: none; }
      }
      @media (max-width: 760px) {
        .app-boot__body { grid-template-columns: minmax(0,1fr); }
        .app-boot__rows { grid-template-columns: repeat(2,minmax(0,1fr)); }
        html[data-boot-screen='inbox'] .app-boot__rows { grid-template-columns: minmax(0,1fr); }
        .app-boot__content { display: none !important; }
      }
    </style>
    <!--
      Theme and language are decided before the first paint from local visual
      preferences. They carry no identity, tenant or authorization information;
      the session remains an HTTP-only cookie confirmed by the API.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('convo.theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0c182b' : '#ffffff');
        // This mirrors `src/prepaint-language.ts`, which supplies the
        // deterministic regression cases. Keep the inline version small so it
        // executes before the module and before the first protected frame.
        // It accepts only the presentation language from the current hash.
        var routeLang = null;
        var queryAt = window.location.hash.indexOf('?');
        if (queryAt !== -1) {
          var parts = window.location.hash.slice(queryAt + 1).split('&');
          for (var index = 0; index < parts.length; index += 1) {
            var pair = parts[index].split('=', 2);
            var key = '';
            var value = '';
            try {
              key = decodeURIComponent(pair[0].replace(/\+/g, ' '));
              value = decodeURIComponent((pair[1] || '').replace(/\+/g, ' '));
            } catch (error) {
              continue;
            }
            if (key === 'lang' && (value === 'en' || value === 'ar')) {
              routeLang = value;
              break;
            }
          }
        }
        var lang = null;
        if (routeLang === null) {
          try {
            lang = window.localStorage.getItem('convo.lang');
          } catch (error) {
            lang = null;
          }
        }
        if (routeLang === 'en' || routeLang === 'ar') lang = routeLang;
        if (lang !== 'en' && lang !== 'ar') lang = 'ar';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        var route = window.location.hash.slice(1).split('?')[0].replace(/^\//, '').split('/')[0];
        var screens = ['inbox', 'contacts', 'channels', 'broadcasts', 'automations', 'analytics', 'people', 'roles', 'teams', 'settings'];
        document.documentElement.setAttribute('data-boot-screen', route === 'accept-invitation' || route === 'reset-password' ? 'auth' : (screens.indexOf(route) === -1 ? 'inbox' : route));
      })();
    </script>
    <!--
      Inter (Latin) and Readex Pro (Arabic) are self-hosted variable fonts from
      /fonts (SIL OFL 1.1, licences beside the files). No third-party font host
      is contacted.
    -->
    <link rel="preload" href="/fonts/readex-pro-arabic-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      The same branded wait the app draws while the session is checked, so the
      hand-over from this placeholder to the first render does not flash. No
      navigation, tenant or screen exists until the server confirms a session.
    -->
    <div id="app" class="app-boot" role="status" aria-live="polite" aria-label="Loading DS Omnichannel">
      <div class="app-boot__nav" aria-hidden="true"><span class="app-boot__mark">DS</span><span class="app-boot__nav-item"></span><span class="app-boot__nav-item"></span><span class="app-boot__nav-item"></span></div>
      <div class="app-boot__main" aria-hidden="true">
        <div class="app-boot__header"><span class="app-boot__line"></span></div>
        <div class="app-boot__body">
          <div class="app-boot__rows" aria-hidden="true"><span class="app-boot__row"></span><span class="app-boot__row"></span><span class="app-boot__row"></span><span class="app-boot__row"></span></div>
          <div class="app-boot__content" aria-hidden="true">
            <span class="app-boot__brand-name" lang="en">DS Omnichannel</span>
            <span class="app-boot__brand-name" lang="ar">دي إس أومني تشانل</span>
            <span class="app-boot__line"></span>
            <span class="app-boot__status" lang="en">Preparing your workspace</span>
            <span class="app-boot__status" lang="ar">نجهّز مساحة عملك</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
