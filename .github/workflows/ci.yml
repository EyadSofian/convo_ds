name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Order follows docs/testing/strategy.md section 6.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      # The integration project starts a real PostgreSQL through
      # embedded-postgres (ADR-0015), so no service container is needed yet.
      # A RabbitMQ and a MinIO service are added here in P2, when the broker
      # and object-store adapters land and their contract tests become runnable.
      - name: Integration tests
        run: pnpm test:integration

      - name: Property tests
        run: pnpm test:property

      - name: Contract tests
        run: pnpm test:contracts

      - name: Security tests
        run: pnpm test:security

      # DEP-14. This step fails the build when coverage drops below the gates in
      # docs/testing/strategy.md. Lowering a threshold to make it pass is
      # forbidden by that document; see docs/testing/coverage-exclusions.md.
      - name: Coverage gate
        run: pnpm test:coverage

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage/
          if-no-files-found: ignore
